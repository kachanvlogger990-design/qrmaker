<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Digital Menu</title>
    <meta name="description" content="Scan to view this digital menu.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        body {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 16px 12px 40px;
            background: #000;
        }

        .menu-container {
            width: 100%;
            max-width: 600px;
            background: var(--bg-primary);
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: 0 4px 50px rgba(0, 0, 0, 0.5);
        }

        .menu-header {
            padding: 24px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .restaurant-brand {
            position: relative;
        }

        .restaurant-logo {
            width: 72px;
            height: 72px;
            border-radius: 14px;
            object-fit: cover;
            border: 2px solid #ff6b6b;
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.3);
        }

        .restaurant-icon-fallback {
            width: 72px;
            height: 72px;
            border-radius: 14px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #fff;
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.3);
        }

        .restaurant-title {
            font-size: 1.6rem;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            color: var(--text-primary);
        }

        .menu-body {
            padding: 16px;
            min-height: 400px;
        }

        .full-menu-image {
            width: 100%;
            height: auto;
            border-radius: var(--radius-md);
            display: block;
        }

        .missing-menu {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            display: none;
        }

        .powered-by {
            text-align: center;
            font-size: 0.72rem;
            color: var(--text-muted);
            padding: 20px;
        }

        .error-state {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 12px;
            padding: 100px 20px;
            color: var(--text-secondary);
        }

        .menu-text-container {
            padding: 8px 0;
        }

        .menu-category-block {
            margin-bottom: 32px;
        }

        .menu-category-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            color: #ff6b6b;
            border-bottom: 2px solid rgba(255, 107, 107, 0.2);
            padding-bottom: 8px;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .menu-item-row {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
        }

        .menu-item-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 4px;
        }

        .menu-item-name {
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--text-primary);
        }

        .menu-item-leader {
            flex: 1;
            border-bottom: 1px dotted var(--text-muted);
            opacity: 0.4;
            position: relative;
            top: -4px;
        }

        .menu-item-price {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            color: var(--accent-2);
            font-size: 1.1rem;
        }

        .menu-item-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
            padding-right: 40px;
        }

        /* Splash Screen */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease-in-out, visibility 0.6s;
        }

        .splash-screen.hide {
            opacity: 0;
            visibility: hidden;
        }

        .splash-logo-wrap {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #fff;
            box-shadow: 0 8px 30px rgba(255, 107, 107, 0.4);
            animation: pulse-splash 1.5s infinite alternate;
        }

        .splash-logo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            display: none;
            /* Shown dynamically if URL exists */
        }

        @keyframes pulse-splash {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 rgba(255, 107, 107, 0.4);
            }

            100% {
                transform: scale(1.05);
                box-shadow: 0 10px 40px rgba(255, 107, 107, 0.6);
            }
        }
    </style>
</head>

<body data-page="restaurant-menu">

    <!-- Splash Screen -->
    <div id="splash-screen" class="splash-screen">
        <div class="splash-logo-wrap" id="splash-logo-wrap">
            <i class="fa-solid fa-utensils" id="splash-icon"></i>
            <img id="splash-img" src="" alt="Restaurant Logo">
        </div>
    </div>

    <div class="menu-container fade-in">

        <!-- Loading State -->
        <div id="loading-state" class="loading-state" style="display:flex; height:600px;">
            <div class="spinner"></div>
            <p style="font-size:0.85rem;">Fetching Menu…</p>
        </div>

        <!-- Error State -->
        <div id="error-state" class="error-state">
            <div class="error-icon"><i class="fa-solid fa-link-slash"></i></div>
            <h3>Menu Unavailable</h3>
            <p style="font-size:0.85rem;"></p>
        </div>

        <!-- Menu Content -->
        <div id="menu-content" style="display:none;">

            <div class="menu-header">
                <div class="restaurant-brand">
                    <img id="restaurant-logo" class="restaurant-logo" src="" alt="Restaurant Logo">
                    <div id="restaurant-icon-fallback" class="restaurant-icon-fallback">
                        <i class="fa-solid fa-utensils"></i>
                    </div>
                </div>
                <h1 id="restaurant-title" class="restaurant-title">—</h1>
            </div>

            <div class="menu-body" id="menu-text-container">
                <!-- Categories and Items rendered dynamically via JS -->
            </div>

            <div class="powered-by">
                <i class="fa-solid fa-utensils" style="margin-right:4px; color:#ff6b6b;"></i>
                Powered by Restaurant QR Menus
            </div>

        </div>

    </div>

    <script src="restaurant-app.js"></script>
</body>

</html>
